name: build-images
on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/build.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [rag-api, embedder, ingest, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/anubis-rag-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/anubis-rag-${{ matrix.service }}:${{ github.sha }}
