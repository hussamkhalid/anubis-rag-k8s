server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the RAG API service (name/port from the Helm values).
    # RAG_API_UPSTREAM is substituted at container start by the entrypoint.
    location /api/ {
        proxy_pass http://${RAG_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 200m;   # allow large document uploads
        proxy_read_timeout 300s;
    }
}
