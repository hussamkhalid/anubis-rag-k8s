apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: qdrant }
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: {{ .Values.namespace }}
spec:
  serviceName: qdrant
  replicas: 1
  selector: { matchLabels: { app: qdrant } }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: qdrant
          image: {{ include "img.qdrant" . }}
          ports:
            - { containerPort: 6333 }
            - { containerPort: 6334 }
          env:
            - { name: QDRANT__STORAGE__STORAGE_PATH, value: /qdrant/storage }
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 6333 }
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata: { name: storage }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.qdrant.className }}
        resources: { requests: { storage: {{ .Values.storage.qdrant.size }} } }
